{{ if and .Values.postgresql.enable (not .Values.postgresql.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    release: {{ .Release.Name }}
type: Opaque
data:
  {{ .Values.postgresql.passwordKey }}: {{ required "postgresql.password or postgresql.existingSecret is required" .Values.postgresql.password | b64enc | quote }}
{{ end }}
