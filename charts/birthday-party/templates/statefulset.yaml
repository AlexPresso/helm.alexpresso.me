{{ if .Values.postgresql.enable }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    name: {{ .Release.Name }}-postgresql
spec:
  serviceName: {{ .Release.Name }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      name: {{ .Release.Name }}-postgresql
  template:
    metadata:
      labels:
        name: {{ .Release.Name }}-postgresql
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # The official PostgreSQL Alpine image uses UID/GID 70.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: {{ .Values.postgresql.volume.existingClaim | default (printf "%s-postgresql" .Release.Name) }}

      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret | default (printf "%s-secrets" .Release.Name) }}
                  key: {{ .Values.postgresql.passwordKey }}
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
          volumeMounts:
            - name: database
              mountPath: /var/lib/postgresql
          resources:
{{- toYaml .Values.postgresql.resources | nindent 12 }}

          startupProbe:
            exec:
              command: &probe-command [sh, -ec, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: *probe-command
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: *probe-command
            periodSeconds: 10
            timeoutSeconds: 3
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{- toYaml . | nindent 8 }}
      {{- end }}
{{ end }}
