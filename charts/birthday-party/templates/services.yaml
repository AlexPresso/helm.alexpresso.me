apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      name: http
      protocol: TCP
      targetPort: http
  selector:
    name: {{ .Release.Name }}-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      name: http
      protocol: TCP
      targetPort: http
  selector:
    name: {{ .Release.Name }}-backend
{{- if .Values.postgresql.enable }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgresql
spec:
  clusterIP: None
  ports:
    - port: 5432
      name: postgresql
      protocol: TCP
      targetPort: postgresql
  selector:
    name: {{ .Release.Name }}-postgresql
{{- end }}
